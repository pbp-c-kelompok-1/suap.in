name: Push to PWS

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Push to PWS
        env:
          PWS_URL: ${{ secrets.PWS_URL }}
        run: |
          if [ -z "$PWS_URL" ]; then
            echo "::warning::PWS_URL secret is not configured in repository secrets. Skipping automated deployment."
            exit 0
          fi
          echo "Current branch: ${GITHUB_REF_NAME:-master}"
          push_output=$(git push --force "$PWS_URL" "HEAD:master" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Push failed: $push_output"
            exit 1
          fi
          echo "Push successful: $push_output"
