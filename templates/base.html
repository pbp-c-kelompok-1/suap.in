<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Suap.in — Foto makananmu, lacak jejakmu{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <a href="/" class="font-bold text-green-600 text-xl">🌿 Suap.in</a>
        <div class="flex gap-4 items-center text-sm">
            {% if user.is_authenticated %}
                <span class="text-gray-500">🔥 Streak</span>
                <a href="/scanner/" class="bg-green-600 text-white px-4 py-2 rounded-lg">Scan Makanan</a>
                <a href="/auth/logout/" class="text-gray-500">Logout</a>
            {% else %}
                <a href="/auth/login/" class="text-gray-600">Masuk</a>
                <a href="/auth/register/" class="bg-green-600 text-white px-4 py-2 rounded-lg">Daftar</a>
            {% endif %}
        </div>
    </nav>
    <main class="max-w-5xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
