<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if toggle %}
  <div class="pass-wrap">
    {{ field }}
    <button type="button" class="eye-btn" data-toggle-password="{{ field.id_for_label }}" aria-label="Tampilkan atau sembunyikan kata sandi">
      <svg class="i" data-eye><use href="#i-eye"/></svg>
      <svg class="i" data-eye-off hidden><use href="#i-eye-off"/></svg>
    </button>
  </div>
  {% else %}
  {{ field }}
  {% endif %}
  {% for error in field.errors %}<small class="strength-lbl" style="color:var(--danger)">{{ error }}</small>{% endfor %}
  {% if hint and not field.errors %}<small class="strength-lbl">{{ hint }}</small>{% endif %}
</div>
