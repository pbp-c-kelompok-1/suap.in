{% extends 'base.html' %}

{% block title %}{{ title }} — Suap.in{% endblock %}

{% block content %}
<div class="flex flex-col items-center text-center" style="padding: 56px 0;">
  <span class="mascot mb-8">{% include 'partials/icon.html' with name=icon cls='ico-xl' %}</span>
  <span class="badge badge-accent mb-4">Segera hadir</span>
  <h1 class="page-title">{{ title }}</h1>
  <p class="page-sub" style="max-width: 420px; line-height: 1.6;">{{ description }}</p>
  <a href="{% url 'scanner:scan' %}" class="btn-accent btn-lg mt-10">{% include 'partials/icon.html' with name='camera' %} Scan makanan dulu</a>
</div>
{% endblock %}
