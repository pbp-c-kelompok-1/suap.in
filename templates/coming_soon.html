{% extends 'base.html' %}

{% block title %}{{ title }} — Suap.in{% endblock %}

{% block content %}
<div class="topbar"><h1>{{ title }}</h1>{% include 'partials/auth_status.html' %}</div>

<div class="empty">
  <div class="mascot-wrap" id="mascotSoon" style="width:120px;height:120px;margin:0 auto"></div>
  <h3>Segera hadir</h3>
  <p>{{ description }}</p>
  <a href="{% url 'scanner:scan' %}" class="btn ok" style="margin-top:18px"><svg class="i"><use href="#i-camera"/></svg>Scan makanan dulu</a>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  var slot = document.getElementById('mascotSoon');
  var tpl = document.getElementById('mascot-tpl');
  if (slot && tpl) slot.appendChild(tpl.content.cloneNode(true));
})();
</script>
{% endblock %}
