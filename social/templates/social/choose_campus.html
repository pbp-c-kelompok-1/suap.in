{% extends 'base.html' %}
{% block title %}Pilih Kampus — Suap.in{% endblock %}

{% block content %}
<h1 class="page-title mb-6">Pilih Kampus</h1>
<form method="post" class="card flex flex-col gap-4" style="max-width: 420px;">
  {% csrf_token %}
  {{ form.university.label_tag }}
  {{ form.university }}
  {{ form.university.errors }}

</form>
{% endblock %}
