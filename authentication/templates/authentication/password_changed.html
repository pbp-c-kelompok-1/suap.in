{% extends 'base.html' %}

{% block title %}Password Berhasil Diubah — Suap.in{% endblock %}

{% block content %}
<div class="topbar"><h1>Berhasil</h1></div>

<div class="raise authcard" style="text-align:center">
  <div class="mascot-wrap" id="mascotDone" style="width:110px;height:110px;margin:0 auto 14px"></div>
  <h2>Password berhasil diubah!</h2>
  <p class="authsub">Sekarang kamu bisa masuk pakai kata sandi barumu.</p>
  <a href="{% url 'authentication:login' %}" class="btn ok wide">Kembali ke Masuk</a>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
  var slot = document.getElementById('mascotDone');
  var tpl = document.getElementById('mascot-tpl');
  if (slot && tpl) slot.appendChild(tpl.content.cloneNode(true));
})();
</script>
{% endblock %}
