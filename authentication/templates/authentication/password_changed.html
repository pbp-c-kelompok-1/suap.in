{% extends 'auth_base.html' %}

{% block title %}Password Changed — Suap.in{% endblock %}

{% block auth_content %}
<div class="flex flex-col items-center text-center py-10">
  <span class="ring ring-circle mb-8">
    <span class="btn-accent btn-icon-lg" style="cursor: default;">{% include 'partials/icon.html' with name='check' cls='ico-xl' %}</span>
  </span>
  <h1 class="auth-title mb-3">Password Changed!</h1>
  <p class="text-secondary mb-10" style="font-weight: 500; line-height: 1.6;">
    Your password has been changed successfully.
  </p>
  <span class="ring ring-squircle ring-block">
    <a href="{% url 'authentication:login' %}" class="btn-accent btn-lg">Back to Login</a>
  </span>
</div>
{% endblock %}
