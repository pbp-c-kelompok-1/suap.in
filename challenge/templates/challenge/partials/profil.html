<!-- ================= PROFIL ================= -->
<section class="page" id="page-profil" aria-labelledby="h-prof">
  <div class="topbar">
    <h1 id="h-prof">Profil</h1>
    <span class="chip streak"><svg class="i"><use href="#i-flame"/></svg><span id="pStreak">0</span> hari</span>
    <span class="chip lvl">
      <svg class="i"><use href="#i-leaf"/></svg>
      Lv <span id="pLvl">1</span>
    </span>
  </div>

  <div class="prof-grid">
    <div class="raise card prof-card">
      <div class="pedestal"><div class="avw big" id="avBig"></div></div>
      <div class="av-name display" id="avName"></div>
      <div class="av-meta" id="avMeta">Dipakai sekarang</div>
      
      <div class="xp-progress">
        <div class="xp-head">
          <span id="xpLabel">0/0 XP</span>
          <span id="xpNext">0 XP lagi untuk ke level berikutnya</span>
        </div>
        <div class="pxp-track" role="progressbar" aria-label="Progress XP" id="pXpTrack">
          <div class="pxp-fill" id="pXpFill"></div>
        </div>
      </div>

      <div class="field"><label for="pName">Nama</label><input id="pName" maxlength="24" autocomplete="off" disabled></div>
      <div class="field"><label for="pBio">Bio <small id="bioCount"></small></label><textarea id="pBio" maxlength="80" rows="2" disabled></textarea></div>

      <p class="muted profile-hint" id="profHint"></p>

      <div class="profile-actions">
        <button class="btn ghost" id="editProfile">Edit profil</button>
        <button class="btn ghost" id="cancelProfile" hidden>Batal</button>
        <button class="btn ok" id="saveProfile" hidden>Simpan perubahan</button>
      </div>
    </div>

    <div class="raise card pick-card readonly" id="pickCard">
      <div class="sec-head"><h2>Pilih avatarmu</h2><span id="avCount">0/140 terbuka</span></div>
      <div class="sptabs" id="spTabs" role="tablist" aria-label="Jenis avatar"></div>
      <div class="pick-actions">
        <button class="btn ghost sm" id="avShuffle"><svg class="i"><use href="#i-shuffle"/></svg>Acak</button>
      </div>
      <div class="lockbar" id="lockBar" hidden></div>
      <div class="av-grid" id="avGrid"></div>
    </div>
  </div>

  <div class="raise card" style="margin-top:26px">
    <div class="sec-head"><h2>Statistik & lencana</h2></div>
    <div class="stats" id="statsRow"></div>
    <p class="muted stat-note">"Hemat dari budget" = selisih budget harianmu di hari-hari yang sudah lewat. Hari ini belum dihitung karena belum selesai.</p>
    <div class="badges" id="badgeRow"></div>
  </div>
</section>
